name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'backend/web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Aláíró kulcs
        env:
          KEYSTORE_B64: ${{ secrets.PORSZI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Hiányzik a PORSZI_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/porszi.jks"

      - name: APK építése
        working-directory: android
        env:
          PORSZI_KEYSTORE: ${{ runner.temp }}/porszi.jks
          PORSZI_KEYSTORE_PASSWORD: ${{ secrets.PORSZI_KEYSTORE_PASSWORD }}
          PORSZI_KEY_ALIAS: porszi
          PORSZI_KEY_PASSWORD: ${{ secrets.PORSZI_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=$CODE -PversionName=1.$CODE
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Porszi.apk"
          echo "CODE=$CODE" >> "$GITHUB_ENV"

      - name: Kiadás (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ env.CODE }}
          name: Porszi app 1.${{ env.CODE }}
          body: ${{ github.event.head_commit.message || 'Kézi build' }}
          files: Porszi.apk
          make_latest: true
